<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visita Caribe · Импорт</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0 auto;width:390px;max-width:100%;background:#0e1015;color:#f1f3f5;font:13px/1.45 system-ui,-apple-system,Arial,sans-serif}
main{padding:20px}h1{font-size:18px;margin:0 0 3px;font-weight:700}p{color:#989da8;margin:0 0 16px}
label{display:block;font-weight:600;font-size:12px;margin:14px 0 6px}
input{display:block;width:100%;background:#20232a;color:#fff;border:0;border-radius:9px;padding:11px;font:inherit;outline:none}
input:focus{box-shadow:0 0 0 2px #4569da}input::placeholder{color:#757985}
button{font:inherit;font-weight:650;width:100%;border:0;border-radius:10px;cursor:pointer;padding:12px 14px;margin-top:10px;background:#2b303b;color:#fff}
button.primary{background:#5676e7}button:disabled{opacity:.35;cursor:default}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two button{font-size:12px}
.status{margin-top:16px;padding:14px;border-radius:11px;background:#20232a;color:#bbc0ce}.status strong{display:block;color:#fff;margin-bottom:5px}
.muted{font-size:11px;color:#9197a3;overflow-wrap:anywhere}progress{width:100%;height:7px;border:0;border-radius:10px;overflow:hidden;margin:9px 0 5px}
progress::-moz-progress-bar{background:#6687f0}#errors{margin-top:8px;color:#e9a5a5}
</style></head><body><main>
<h1>Импорт недвижимости</h1><p>Zonaprop → JSON → Laravel</p>
<label for="source">URL страницы выдачи</label><input id="source" type="url" placeholder="https://www.zonaprop.com.ar/casas-venta-pinamar-pagina-2.html">
<label for="endpoint">Laravel API endpoint</label><input id="endpoint" type="url" placeholder="https://visitacaribe.com/api/realestate/import">
<label for="token">API токен (не сохраняется)</label><input id="token" type="password" autocomplete="off">
<button class="primary" id="collect">Собрать JSON</button>
<button id="collectSend">Собрать и отправить в Laravel</button>
<div class="two"><button id="upload">Отправить готовый JSON</button><button id="download">Скачать JSON</button></div>
<button id="panel">Открыть панель во вкладке</button>
<button id="cancel" hidden>Остановить</button>
<div class="status"><strong id="phase">Готово к запуску</strong><div id="current" class="muted"></div>
<progress id="progress" max="1" value="0"></progress><div id="count" class="muted"></div><div id="errors" class="muted"></div></div>
</main><script src="popup.js"></script></body></html>
